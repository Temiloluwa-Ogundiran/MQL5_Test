services:
  db:
    image: postgres:16-alpine
    expose: ["5432"]
    environment:
      POSTGRES_DB: mql5
      POSTGRES_USER: mql5
      POSTGRES_PASSWORD: mql5
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    expose: ["8000"]
    environment:
      DATABASE_URL: postgresql://mql5:mql5@db:5432/mql5
      STALE_SEC: 120
    depends_on: [db]
volumes:
  pgdata:
